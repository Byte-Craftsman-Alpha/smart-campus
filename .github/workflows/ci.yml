name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  domain:
    name: Domain suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Interval, policy, availability and lifecycle tests
        run: python3 -m pytest tests -q

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m playwright install --with-deps chromium
      - name: Drive the application in a real browser
        run: python3 tests/e2e/run_browser_suite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: docs/testing/screenshots/
